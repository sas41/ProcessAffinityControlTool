[package]
name = "process_affinity_control_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tokio", "tiny-skia", "fira-sans", "auto-detect-theme", "svg"] }
iced_aw = { version = "0.11" }
iced_fonts = { version = "0.1.1", features = ["bootstrap"] }
tray-icon = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
sysinfo = { version = "0.30", features = ["default"] }
hwlocality = { version = "1.0.0-alpha.11", features = ["hwloc-2_4_0", "vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
unicase = "2.9"
num_cpus = "1.16"
dirs = "5.0"
bitflags = "2.4"
open = "5.3"
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = { version = "2.0" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["sched", "process"] }
gtk = "0.18"

[target.'cfg(unix)'.dependencies]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = true
