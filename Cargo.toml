[package]
name = "process_affinity_control_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { version = "0.33", features = ["default"] }
eframe = { version = "0.33", features = ["default"] }
sysinfo = { version = "0.30", features = ["default"] }
hwlocality = { version = "1.0.0-alpha.11", features = ["hwloc-2_4_0", "vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.11"
rfd = "0.14"
unicase = "2.9"
num_cpus = "1.16"
dirs = "5.0"
bitflags = "2.4"
open = "5.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }
embed-resource = { version = "2.0" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["sched", "process"] }

[target.'cfg(unix)'.dependencies]
